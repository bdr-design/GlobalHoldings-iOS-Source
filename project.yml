name: GlobalHoldings
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "2.9.1"
    CURRENT_PROJECT_VERSION: "260"
targets:
  GlobalHoldings:
    type: application
    platform: iOS
    sources:
      - path: iOS/GlobalHoldings
        excludes:
          - Assets.xcassets
    resources:
      - path: iOS/GlobalHoldings/Assets.xcassets
    info:
      path: iOS/GlobalHoldings/Info.plist
      properties:
        CFBundleDisplayName: "Global Holdings"
        CFBundleShortVersionString: "2.9.1"
        CFBundleVersion: "260"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIDeviceFamily:
          - 1
        UILaunchStoryboardName: LaunchScreen
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Global Holdings Update"
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.bdran.globalholdings.update
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bdran.globalholdings.update
            UTTypeDescription: "Global Holdings Update"
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - saneiupdate
                - ghupdate
              public.mime-type: application/x-globalholdings-update
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.globalholdings
        PRODUCT_NAME: GlobalHoldings
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    scheme:
      testTargets: []
    postBuildScripts:
      - name: Copy WebApp Files
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/WebApp"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRCROOT/WebApp/." "$DEST/"
