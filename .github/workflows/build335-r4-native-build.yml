name: Build335 R4 source verification and fresh native build
on:
  push:
    branches: [build335-persistence-root-20260923]
    paths: ['.github/workflows/build335-r4-native-build.yml', 'audit-tools/r4-native-change.gz.b64', 'audit-tools/r4-bundled-copy-alias-fix.patch', 'audit-tools/prepare_r4_bundle_tests.py']
permissions:
  contents: read
jobs:
  verify-and-compile:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Reconstruct exact candidate native sources without any old IPA or WebApp
        shell: bash
        run: |
          set -euo pipefail
          for dir in native-reference audit-control; do
            git init "$dir"
            git -C "$dir" remote add origin https://github.com/bdr-design/GlobalHoldings-iOS-Source.git
          done
          git -C native-reference fetch --depth=1 origin 5f9d195e4a23ccfa669eeb0e9f7e92acfb3ac01f
          git -C native-reference checkout --detach FETCH_HEAD
          git -C audit-control fetch --depth=1 origin "$GITHUB_SHA"
          git -C audit-control checkout --detach FETCH_HEAD
          mkdir -p audit/reference/iOS audit/evidence audit/tools
          cp -R native-reference/iOS/GlobalHoldings audit/reference/iOS/
          cp native-reference/project.yml audit/reference/project.yml
          cp audit-control/audit-tools/*.py audit/tools/
          python3 audit/tools/patch_native.py --reference audit/reference --output audit/n1
          cp -R audit/n1/source audit/candidate
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('audit/candidate')
          expected={'AppDelegate.swift':'ac85c6e05e16ee9e7ac927d2e46bd83c577c7d208bff503709decd1f3dd2421b','GlobalGameStorage.swift':'facdc70c3086f2bafb486b17a77db3e2472557cda3aef961b07555e4bb0792e5','GlobalSaveVault.swift':'d4755cf780a614b39482adf6377b485d7b7f0e392974375ac3f35b33739279b0','GameViewController.swift':'091872028d355a565cbe558710e90d86270d1e0f8c09d7db8758d62c2b9edecc'}
          for n,h in expected.items(): assert hashlib.sha256((root/'iOS/GlobalHoldings'/n).read_bytes()).hexdigest()==h,n
          diff=gzip.decompress(base64.b64decode(Path('audit-control/audit-tools/r4-native-change.gz.b64').read_text()))
          assert hashlib.sha256(diff).hexdigest()=='2ec982d7bead499cfac59407f530dbce0fb9fe0d2872eeaea6b2c5a2ee23de25'
          Path('audit/evidence/native-source-changes.diff').write_bytes(diff)
          subprocess.run(['patch','-p1','-i',str(Path('audit/evidence/native-source-changes.diff').resolve())],cwd=root,check=True)
          expected={'AppDelegate.swift':'ac85c6e05e16ee9e7ac927d2e46bd83c577c7d208bff503709decd1f3dd2421b','GlobalGameStorage.swift':'31ca90eeb448810ea49b8c6e0cfe14dd3f4615ff0dce1edff7616bac9ce9f4ea','GlobalSaveVault.swift':'71258a4fb4482d0a77e89bd532647ab6010b6b22f6def25f36bf79b431989b7b','GameViewController.swift':'329103397d05e60156fc33366159e475b0e63b2871dd08085c6e9d6a4b284643'}
          for n,h in expected.items(): assert hashlib.sha256((root/'iOS/GlobalHoldings'/n).read_bytes()).hexdigest()==h,n
          alias_fix=(Path('audit-control/audit-tools/r4-bundled-copy-alias-fix.patch')).resolve()
          subprocess.run(['patch','-p1','-i',str(alias_fix)],cwd=root,check=True)
          fixed_hash=hashlib.sha256((root/'iOS/GlobalHoldings/GlobalGameStorage.swift').read_bytes()).hexdigest()
          assert fixed_hash=='cee936612b3017c810e5c904b617d96091046077400c2f9e187b7a020b81a44a',fixed_hash
          fixed_text=(root/'iOS/GlobalHoldings/GlobalGameStorage.swift').read_text()
          block=fixed_text[fixed_text.index('    private func validateBundledCopy'):fixed_text.index('    private func installBundledBaseline')]
          assert 'safeRelativePath(of: file, inside: root)' in block
          assert 'dropFirst(root.path.count + 1)' not in block
          expected['GlobalGameStorage.swift']=fixed_hash
          webhash='699d467fdc3eee220980ae9ad304a1aa8e7f980aa707b61fb16f5d037e94712a'
          project=root/'project.yml';text=project.read_text().replace('CURRENT_PROJECT_VERSION: "315"','CURRENT_PROJECT_VERSION: "335"').replace('CFBundleVersion: "315"','CFBundleVersion: "335"\n        GHSourceSnapshotSHA256: "'+webhash+'"');project.write_text(text)
          (root/'WebApp').mkdir()
          # This is only an intermediate compiler product. The final IPA is
          # assembled with the exact locally tested 334 WebApp, never old files.
          (root/'WebApp/ASSEMBLY_PENDING.txt').write_text('Not an installable game. Exact tested WebApp assembly required.\n')
          Path('audit/evidence/source-inputs.json').write_text(json.dumps({'workflow_commit':os.environ['GITHUB_SHA'],'native_reference':'5f9d195e4a23ccfa669eeb0e9f7e92acfb3ac01f','swift_sha256':expected,'webapp_tree_sha256':webhash,'project_sha256':hashlib.sha256(project.read_bytes()).hexdigest(),'old_ipa_used':False,'native_intermediate_only':True},indent=2))
          PY
          xcodebuild -version > audit/evidence/xcode-version.txt
          xcrun swiftc --version > audit/evidence/swift-version.txt
          sw_vers > audit/evidence/macos-version.txt
      - name: Typecheck all native source against iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -parse audit/candidate/iOS/GlobalHoldings/*.swift 2>&1 | tee audit/evidence/parse.log
          xcrun swiftc -typecheck -swift-version 5 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.0 audit/candidate/iOS/GlobalHoldings/*.swift 2>&1 | tee audit/evidence/iphoneos-typecheck.log
      - name: Run all N1 storage regression cases with real file I/O and CryptoKit
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/audit/candidate"
          OUT="$GITHUB_WORKSPACE/audit/evidence/native-regression"
          python3 audit/tools/prepare_native_tests.py --source "$SRC" --output "$OUT"
          xcrun swiftc -swift-version 5 -sdk "$(xcrun --sdk macosx --show-sdk-path)" "$SRC/iOS/GlobalHoldings/GlobalSaveVault.swift" "$SRC/iOS/GlobalHoldings/GlobalGameStorage.swift" "$OUT/main.swift" -o "$RUNNER_TEMP/native-regression" 2>&1 | tee "$OUT/compile.log"
          (cd "$OUT" && GH_NATIVE_AUDIT_EPHEMERAL=1 "$RUNNER_TEMP/native-regression") 2>&1 | tee "$OUT/run.log"
      - name: Run real WKWebView navigation recovery and page ownership checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/tools/prepare_n2_tests.py');s=p.read_text()
          old="helpers=method('    private func prepareNextNativeBootstrap(')+'\\n'+method('    private func installBootstrapBeforeNavigation(')"
          new="helpers='\\n'.join(method(name) for name in ['    private func prepareNextNativeBootstrap(', '    private func installBootstrapBeforeNavigation(', '    private func isTrustedGameDocument(', '    private func isCurrentDocument(', '    func webView(_ webView: WKWebView, didCommit navigation:'])"
          assert old in s;s=s.replace(old,new)
          s=s.replace(' var nativeNavigationToken:UInt=0',' var nativeNavigationToken:UInt=0\n var navigationPreparing=false')
          s=s.replace('func userContentController(_ c:WKUserContentController,didReceive m:WKScriptMessage){if let p=m.body as? [String:Any]{messages.append(p)}}','func userContentController(_ c:WKUserContentController,didReceive m:WKScriptMessage){guard !navigationPreparing,m.webView === webView,m.frameInfo.isMainFrame,isTrustedGameDocument(m.frameInfo.request.url) else{return};if let p=m.body as? [String:Any]{messages.append(p)}}')
          marker='test("large bootstrap request returns without waiting'
          tests='test("old-page completion cannot acknowledge a replacement document") {let old=probe.nativeNavigationToken;let _=try navigate();try check(!probe.isCurrentDocument(old),"stale page token accepted");try check(probe.isCurrentDocument(probe.nativeNavigationToken),"current page locked after didCommit")}\n'
          tests+='test("navigation preparation rejects completion before commit") {let token=probe.nativeNavigationToken;probe.navigationPreparing=true;try check(!probe.isCurrentDocument(token),"accepted during navigation");probe.navigationPreparing=false;try check(probe.isCurrentDocument(token),"current page not restored")}\n'
          assert marker in s;s=s.replace(marker,tests+marker)
          Path('audit/tools/prepare_r4_navigation_tests.py').write_text(s)
          PY
          SRC="$GITHUB_WORKSPACE/audit/candidate"
          OUT="$GITHUB_WORKSPACE/audit/evidence/navigation"
          python3 audit/tools/prepare_r4_navigation_tests.py "$SRC" "$OUT"
          xcrun swiftc -swift-version 5 -sdk "$(xcrun --sdk macosx --show-sdk-path)" -framework AppKit -framework WebKit "$SRC/iOS/GlobalHoldings/GlobalSaveVault.swift" "$SRC/iOS/GlobalHoldings/GlobalGameStorage.swift" "$OUT/main.swift" -o "$RUNNER_TEMP/navigation" 2>&1 | tee "$OUT/compile.log"
          (cd "$OUT" && GH_NATIVE_AUDIT_EPHEMERAL=1 "$RUNNER_TEMP/navigation") 2>&1 | tee "$OUT/run.log"
      - name: Test actual first install and same Build335 repair staging
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/audit/candidate"
          OUT="$GITHUB_WORKSPACE/audit/evidence/bundle"
          python3 audit/tools/prepare_r4_bundle_tests.py "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit/evidence/bundle/main.swift');p.write_text(p.read_text().replace('334','335'))
          PY
          TEST_APP="$RUNNER_TEMP/R4BundleTests.app"
          mkdir -p "$TEST_APP/Contents/MacOS" "$TEST_APP/Contents/Resources"
          export TEST_APP
          python3 - <<'PY'
          import os,plistlib
          from pathlib import Path
          info={'CFBundleIdentifier':'com.example.globalholdings.r4bundletests','CFBundleExecutable':'BundleTests','CFBundlePackageType':'APPL','CFBundleShortVersionString':'3.0.0','CFBundleVersion':'335','GHSourceSnapshotSHA256':'a'*64}
          Path(os.environ['TEST_APP'],'Contents/Info.plist').write_bytes(plistlib.dumps(info))
          PY
          xcrun swiftc -swift-version 5 -sdk "$(xcrun --sdk macosx --show-sdk-path)" "$SRC/iOS/GlobalHoldings/GlobalSaveVault.swift" "$SRC/iOS/GlobalHoldings/GlobalGameStorage.swift" "$OUT/main.swift" -o "$TEST_APP/Contents/MacOS/BundleTests" 2>&1 | tee "$OUT/compile.log"
          (cd "$OUT" && GH_NATIVE_AUDIT_EPHEMERAL=1 "$TEST_APP/Contents/MacOS/BundleTests") 2>&1 | tee "$OUT/run.log"
      - name: Generate project and compile new unsigned iPhone native application
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version > audit/evidence/xcodegen-version.txt
          cd audit/candidate
          xcodegen generate --spec project.yml 2>&1 | tee ../evidence/project-generation.log
          xcodebuild -project GlobalHoldings.xcodeproj -scheme GlobalHoldings -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/R4Derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" clean build 2>&1 | tee ../evidence/xcodebuild.log
          APP="$RUNNER_TEMP/R4Derived/Build/Products/Release-iphoneos/GlobalHoldings.app"
          test -f "$APP/GlobalHoldings"
          file "$APP/GlobalHoldings" > ../evidence/native-executable.txt
          export APP
          python3 - <<'PY'
          import hashlib,json,os,plistlib
          from pathlib import Path
          app=Path(os.environ['APP']);p=plistlib.loads((app/'Info.plist').read_bytes());assert p['CFBundleVersion']=='335' and p['CFBundleShortVersionString']=='3.0.0';assert p['UIDeviceFamily']==[1];assert (app/'Assets.car').stat().st_size>0
          assert p['GHSourceSnapshotSHA256']=='699d467fdc3eee220980ae9ad304a1aa8e7f980aa707b61fb16f5d037e94712a'
          records={x.relative_to(app).as_posix():hashlib.sha256(x.read_bytes()).hexdigest() for x in app.rglob('*') if x.is_file()}
          Path('../evidence/native-product-hashes.json').write_text(json.dumps(records,indent=2))
          PY
          tar -czf ../fresh-native-product.tar.gz -C "$(dirname "$APP")" GlobalHoldings.app
          shasum -a 256 ../fresh-native-product.tar.gz > ../evidence/native-product-tar.sha256
          printf '%s\n' 'Freshly compiled iPhone native product. Not yet an IPA: locally verified Build335 WebApp must replace assembly placeholder and pass exact-copy verification. No prior IPA or executable was used.' > ../PRODUCT_README.txt
      - name: Preserve candidate and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build335-R4-fresh-native-${{ github.run_id }}
          path: audit/
          retention-days: 14
          if-no-files-found: error
