name: Build346 root cleanup verification
on:
  push:
    branches: [fix/build346-time-frame-cleanup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Syntax and focused root contracts
        run: |
          set -euo pipefail
          node --check WebApp/persistence-core.js
          node --check WebApp/app.js
          node --check WebApp/mobility-core.js
          node tests/build346-root-cleanup.cjs
          node tests/build345-mobility-read-conflict.cjs
          node tests/build342-prepared-asset-publish.cjs
          node tests/build342-mobility-trip-archive-app.cjs
          node tests/build339-hour-boundary-write-map.cjs
          node tests/build339-day-boundary-write-map.cjs
          node tests/build334-calendar-safety-contract.cjs
          node tests/build334-600-air-calendar-regression.cjs
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile stream protocol
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gh346-stream"
          cp tests/native/save_stream_main.swift "$RUNNER_TEMP/gh346-stream/main.swift"
          swiftc -O iOS/GlobalHoldings/GlobalSaveStream.swift "$RUNNER_TEMP/gh346-stream/main.swift" -o "$RUNNER_TEMP/gh346-stream/test"
          "$RUNNER_TEMP/gh346-stream/test"
