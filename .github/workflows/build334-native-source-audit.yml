name: Build334 native-source audit - NO IPA
on:
  push:
    branches: [build334-native-audit-n1-20260921]
    paths: ['.github/workflows/build334-native-source-audit.yml']
permissions:
  contents: read
jobs:
  recover-and-typecheck:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Recover exact native reference and audit tools
        shell: bash
        run: |
          set -euo pipefail
          for dir in native-reference audit-control; do
            git init "$dir"
            git -C "$dir" remote add origin https://github.com/bdr-design/GlobalHoldings-iOS-Source.git
          done
          git -C native-reference fetch --depth=1 origin 5f9d195e4a23ccfa669eeb0e9f7e92acfb3ac01f
          git -C native-reference checkout --detach FETCH_HEAD
          git -C audit-control fetch --depth=1 origin "$GITHUB_SHA"
          git -C audit-control checkout --detach FETCH_HEAD
          mkdir -p audit/reference/iOS audit/evidence audit/tools
          cp -R native-reference/iOS/GlobalHoldings audit/reference/iOS/
          cp native-reference/project.yml audit/reference/project.yml
          cp audit-control/audit-tools/*.py audit/tools/
          python3 audit/tools/patch_native.py --reference audit/reference --output audit/candidate
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('audit/candidate/source/iOS/GlobalHoldings')
          expected={'AppDelegate.swift':'ac85c6e05e16ee9e7ac927d2e46bd83c577c7d208bff503709decd1f3dd2421b','GameViewController.swift':'091872028d355a565cbe558710e90d86270d1e0f8c09d7db8758d62c2b9edecc','GlobalGameStorage.swift':'facdc70c3086f2bafb486b17a77db3e2472557cda3aef961b07555e4bb0792e5','GlobalSaveVault.swift':'d4755cf780a614b39482adf6377b485d7b7f0e392974375ac3f35b33739279b0'}
          for name,digest in expected.items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest()!=digest:raise SystemExit('Candidate mismatch: '+name)
          for p in Path('audit').rglob('*'):
              if p.suffix.lower() in {'.ttf','.otf','.woff','.woff2','.p12','.p8','.ipa'}:raise SystemExit('Unexpected artifact: '+str(p))
          Path('audit/evidence/provenance.json').write_text(json.dumps({'native_reference':'5f9d195e4a23ccfa669eeb0e9f7e92acfb3ac01f','workflow_commit':os.environ['GITHUB_SHA'],'candidate_hashes':expected,'matched_installed_build334':False,'ipa_built':False},indent=2)+'\n')
          PY
          xcodebuild -version > audit/evidence/xcode-version.txt
          xcrun swiftc --version > audit/evidence/swift-version.txt
          printf '%s\n' 'Native-only candidate audit. No WebApp replacement. No iPhone executable or IPA. Real Foundation storage tests run on disposable macOS, not iPhone.' > audit/README.txt
      - name: iPhoneOS SDK typecheck of baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          for kind in reference candidate; do
            SRC="$GITHUB_WORKSPACE/audit/reference"
            if [[ "$kind" == candidate ]]; then SRC="$GITHUB_WORKSPACE/audit/candidate/source"; fi
            xcrun swiftc -parse "$SRC"/iOS/GlobalHoldings/*.swift 2>&1 | tee "audit/evidence/$kind-parse.log"
            xcrun swiftc -typecheck -swift-version 5 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.0 "$SRC"/iOS/GlobalHoldings/*.swift 2>&1 | tee "audit/evidence/$kind-iphoneos-typecheck.log"
          done
          printf '%s\n' '{"baseline_typecheck":"passed","candidate_typecheck":"passed","linked_iphone_app":false,"ipa_built":false}' > audit/evidence/typecheck-status.json
      - name: Compile and execute real native storage tests on macOS
        shell: bash
        run: |
          set -euo pipefail
          for kind in reference candidate; do
            SRC="$GITHUB_WORKSPACE/audit/reference"
            if [[ "$kind" == candidate ]]; then SRC="$GITHUB_WORKSPACE/audit/candidate/source"; fi
            OUT="$GITHUB_WORKSPACE/audit/evidence/$kind-tests"
            python3 audit/tools/prepare_native_tests.py --source "$SRC" --output "$OUT"
            xcrun swiftc -swift-version 5 -sdk "$(xcrun --sdk macosx --show-sdk-path)" "$SRC/iOS/GlobalHoldings/GlobalSaveVault.swift" "$SRC/iOS/GlobalHoldings/GlobalGameStorage.swift" "$OUT/main.swift" -o "$RUNNER_TEMP/native-tests-$kind" 2>&1 | tee "$OUT/compile.log"
            set +e
            (cd "$OUT" && GH_NATIVE_AUDIT_EPHEMERAL=1 "$RUNNER_TEMP/native-tests-$kind") 2>&1 | tee "$OUT/run.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            echo "$STATUS" > "$OUT/exit-code.txt"
            test -f "$OUT/native-tests.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit/evidence/reference-tests/native-tests.json').read_text())
          c=json.loads(Path('audit/evidence/candidate-tests/native-tests.json').read_text())
          if r['failed']<1:raise SystemExit('Baseline does not demonstrate a regression')
          if c['failed']!=0:raise SystemExit('Candidate native tests failed')
          print('Baseline:',r['passed'],'/',r['total'],'Candidate:',c['passed'],'/',c['total'])
          PY
      - name: Retain complete source and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build334-N1-native-candidate-${{ github.run_id }}
          path: audit/
          retention-days: 14
          if-no-files-found: error
