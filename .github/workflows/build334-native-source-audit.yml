name: Build334 native-source audit - NO IPA
on:
  push:
    branches: [build334-native-audit-n1-20260921]
    paths: ['.github/workflows/build334-native-source-audit.yml', 'native-audit/**']
permissions:
  contents: read
jobs:
  recover-and-typecheck:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Recover pinned native source only
        shell: bash
        run: |
          set -euo pipefail
          git init native-reference
          git -C native-reference remote add origin https://github.com/bdr-design/GlobalHoldings-iOS-Source.git
          git -C native-reference fetch --depth=1 origin 5f9d195e4a23ccfa669eeb0e9f7e92acfb3ac01f
          git -C native-reference checkout --detach FETCH_HEAD
          mkdir -p audit/source/iOS audit/evidence
          cp -R native-reference/iOS/GlobalHoldings audit/source/iOS/
          cp native-reference/project.yml audit/source/project.yml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('audit/source')
          expected={'AppDelegate.swift':'b6b17d46ee812ae7c69e15837003a5e22bbf6d4b','GameViewController.swift':'80fa0bc02ddb2bcd5463d33736f0f563a71a490a','GlobalGameStorage.swift':'12230a3592e5428023d490afff944b4c0dcad4e7','GlobalSaveVault.swift':'7b07299c0134c7f4182ceed8c618a949ba0d7dbc'}
          rows={}
          for p in sorted(root.rglob('*')):
              if not p.is_file():continue
              data=p.read_bytes();blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if p.name in expected and expected[p.name]!=blob:raise SystemExit('Native blob mismatch: '+str(p))
              if p.suffix.lower() in {'.ttf','.otf','.woff','.woff2','.p12','.p8','.ipa'}:raise SystemExit('Unexpected artifact: '+str(p))
              rows[p.relative_to(root).as_posix()]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob':blob}
          record={'native_reference_commit':'5f9d195e4a23ccfa669eeb0e9f7e92acfb3ac01f','audit_workflow_commit':__import__('os').environ['GITHUB_SHA'],'files':rows,'historical_reference_only':True,'matched_to_installed_build334':False,'ipa_built':False}
          Path('audit/evidence/source-provenance.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          xcodebuild -version > audit/evidence/xcode-version.txt
          xcrun swiftc --version > audit/evidence/swift-version.txt
          printf '%s\n' 'Historical native source reference only. WebApp Build334 is not replaced. This job creates no IPA and makes no release approval.' > audit/README.txt
      - name: Parse and typecheck against real iPhoneOS SDK without linking
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -parse audit/source/iOS/GlobalHoldings/*.swift 2>&1 | tee audit/evidence/swift-parse.log
          xcrun swiftc -typecheck -swift-version 5 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.0 audit/source/iOS/GlobalHoldings/*.swift 2>&1 | tee audit/evidence/iphoneos-typecheck.log
          printf '%s\n' '{"swift_parse":"passed","iphoneos_typecheck":"passed","linked_app":false,"ipa_built":false,"device_tested":false}' > audit/evidence/typecheck-status.json
      - name: Retain source and diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build334-N1-native-reference-${{ github.run_id }}
          path: audit/
          retention-days: 14
          if-no-files-found: error
