name: Build338 save-lag root unsigned IPA
on:
  push:
    branches: [build338-save-lag-root-20260923]
    paths-ignore:
      - 'ci/build338-result.json'

permissions:
  contents: read

concurrency:
  group: build338-save-lag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build338:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Reconstruct verify test and build Build338
        shell: bash
        run: |
          set -euo pipefail
          cat ci338/runner-part-* > "$RUNNER_TEMP/build338-ci.sh"
          chmod +x "$RUNNER_TEMP/build338-ci.sh"
          "$RUNNER_TEMP/build338-ci.sh"

      - name: Real macOS WKWebView recovery and navigation gates
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/candidate"
          OUT="$GITHUB_WORKSPACE/apple/evidence/navigation"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('audit-tools/prepare_n2_tests.py');s=p.read_text()
          old="helpers=method('    private func prepareNextNativeBootstrap(')+'\\n'+method('    private func installBootstrapBeforeNavigation(')"
          new="helpers='\\n'.join(method(name) for name in ['    private func prepareNextNativeBootstrap(', '    private func installBootstrapBeforeNavigation(', '    private func isTrustedGameDocument(', '    private func isCurrentDocument(', '    func webView(_ webView: WKWebView, didCommit navigation:'])"
          assert old in s;s=s.replace(old,new)
          s=s.replace(' var nativeNavigationToken:UInt=0',' var nativeNavigationToken:UInt=0'+chr(10)+' var navigationPreparing=false')
          s=s.replace('func userContentController(_ c:WKUserContentController,didReceive m:WKScriptMessage){if let p=m.body as? [String:Any]{messages.append(p)}}','func userContentController(_ c:WKUserContentController,didReceive m:WKScriptMessage){guard !navigationPreparing,m.webView === webView,m.frameInfo.isMainFrame,isTrustedGameDocument(m.frameInfo.request.url) else{return};if let p=m.body as? [String:Any]{messages.append(p)}}')
          marker='test("large bootstrap request returns without waiting'
          tests='test("old-page completion cannot acknowledge a replacement document") {let old=probe.nativeNavigationToken;let _=try navigate();try check(!probe.isCurrentDocument(old),"stale page token accepted");try check(probe.isCurrentDocument(probe.nativeNavigationToken),"current page locked after didCommit")}'+chr(10)
          tests+='test("navigation preparation rejects completion before commit") {let token=probe.nativeNavigationToken;probe.navigationPreparing=true;try check(!probe.isCurrentDocument(token),"accepted during navigation");probe.navigationPreparing=false;try check(probe.isCurrentDocument(token),"current page not restored")}'+chr(10)
          assert marker in s;s=s.replace(marker,tests+marker)
          Path('audit-tools/prepare_build338_navigation_tests.py').write_text(s)
          PY
          python3 audit-tools/prepare_build338_navigation_tests.py "$SRC" "$OUT"
          xcrun swiftc -swift-version 5 -sdk "$(xcrun --sdk macosx --show-sdk-path)" -framework AppKit -framework WebKit "$SRC/iOS/GlobalHoldings/GlobalSaveVault.swift" "$SRC/iOS/GlobalHoldings/GlobalGameStorage.swift" "$OUT/main.swift" -o "$RUNNER_TEMP/navigation" 2>&1 | tee "$OUT/compile.log"
          (cd "$OUT" && GH_NATIVE_AUDIT_EPHEMERAL=1 "$RUNNER_TEMP/navigation") 2>&1 | tee "$OUT/run.log"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['GITHUB_WORKSPACE'])/'apple/evidence/navigation/n2-navigation-tests.json').read_text())
          assert r['failed']==0 and r['passed']==r['total'] and r['total']>0
          PY

      - name: Bind WKWebView evidence into final verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          ws=Path(os.environ['GITHUB_WORKSPACE'])
          vp=ws/'output/GlobalHoldings_v3_0_0_build338_unsigned.verification.json'
          nav=json.loads((ws/'apple/evidence/navigation/n2-navigation-tests.json').read_text())
          assert nav['failed']==0 and nav['passed']==nav['total'] and nav['total']>0
          r=json.loads(vp.read_text())
          r.setdefault('apple_tests',{})['webkit']={'passed':nav['passed'],'total':nav['total']}
          r['ci_run_id']=int(os.environ['GITHUB_RUN_ID'])
          r['workflow_commit']=os.environ['GITHUB_SHA']
          vp.write_text(json.dumps(r,indent=2)+chr(10))
          PY

      - name: Upload Build338 unsigned deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GlobalHoldings-Build338-Unsigned
          path: |
            output/
            acceptance/results.json
            evidence/
            apple/evidence/
          retention-days: 14
          if-no-files-found: error

      - name: Preserve Build338 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GlobalHoldings-Build338-Failure
          path: |
            evidence/
            acceptance/
            apple/evidence/
          retention-days: 7
          if-no-files-found: ignore
